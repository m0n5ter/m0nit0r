name: Release

# Cross-compiles the agent for every architecture a node might run on and
# publishes the binaries as a GitHub release, which is what install/install.sh
# and install/install.ps1 download. The installers are attached too, so
# releases/latest/download/install.sh is a stable URL for the current one.
# The signed Android client is attached as m0nit0r-<tag>.apk by the android job.
#
# Tag a commit to cut a release:
#
#     git tag v1.2.0 && git push origin v1.2.0
#
# A manual run publishes a release named after the tag you give it, which is
# how a build is re-cut without moving the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (created if it does not exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -eu
          mkdir -p out
          build() {
            export GOOS="$1" GOARCH="$2" CGO_ENABLED=0
            out="out/monitor-$1-$2"
            if [ "$1" = windows ]; then out="$out.exe"; fi
            go build -trimpath -ldflags='-s -w' -o "$out" ./cmd/monitor
            echo "built $out"
          }
          build linux amd64
          build linux arm64
          build linux arm
          build windows amd64

      - name: Checksums
        working-directory: out
        run: sha256sum monitor-* > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          cp install/install.sh install/install.ps1 out/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* \
              --title "$TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi

  # Builds the signed Android client and attaches it to the release the job
  # above created. Signing needs four repository secrets:
  #
  #     ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded
  #     ANDROID_KEYSTORE_PASSWORD
  #     ANDROID_KEY_ALIAS
  #     ANDROID_KEY_PASSWORD
  #
  # The same keystore must sign every release, or Android refuses to install
  # the new APK over the old one.
  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve the tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; see the comment on this job"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        working-directory: android
        env:
          M0NIT0R_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          M0NIT0R_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          M0NIT0R_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          M0NIT0R_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace "-Pm0nit0r.version=$TAG"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          apk="m0nit0r-$TAG.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$TAG" "$apk" --clobber
